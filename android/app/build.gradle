apply plugin: 'com.android.application'

def appProperties = new Properties()
file("$rootDir/../android-config/app.properties").withInputStream {
    appProperties.load(it)
}

def signingProperties = new Properties()
def signingPropertiesFile = file("$rootDir/../android-config/private/keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream {
        signingProperties.load(it)
    }
}

def adsProperties = new Properties()
def adsPropertiesFile = file("$rootDir/../android-config/private/ads.properties")
if (adsPropertiesFile.exists()) {
    adsPropertiesFile.withInputStream {
        adsProperties.load(it)
    }
}

def yodoAppKey = adsProperties['yodoAppKey'] ?: ''
def admobAppId = adsProperties['admobAppId'] ?: ''
def googleAuthProperties = new Properties()
def googleAuthPropertiesFile = file("$rootDir/../android-config/private/google-auth.properties")
if (googleAuthPropertiesFile.exists()) {
    googleAuthPropertiesFile.withInputStream {
        googleAuthProperties.load(it)
    }
}
def googleAuthWebClientId = googleAuthProperties['webClientId'] ?: ''
def quotedGoogleAuthWebClientId = "\"${googleAuthWebClientId.replace('\\', '\\\\').replace('\"', '\\\"')}\""
def buildingRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (buildingRelease && (!yodoAppKey || !admobAppId)) {
    throw new GradleException('Android release ads configuration is missing')
}

android {
    namespace = appProperties['applicationId']
    compileSdk = appProperties['compileSdk'] as Integer
    defaultConfig {
        applicationId appProperties['applicationId']
        minSdkVersion appProperties['minSdk'] as Integer
        targetSdkVersion appProperties['targetSdk'] as Integer
        versionCode appProperties['versionCode'] as Integer
        versionName appProperties['versionName']
        multiDexEnabled true
        manifestPlaceholders = [admobAppId: admobAppId]
        resValue 'string', 'yodo_mas_app_key', yodoAppKey
        buildConfigField 'String', 'GOOGLE_AUTH_WEB_CLIENT_ID', quotedGoogleAuthWebClientId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        ndk {
            abiFilters.addAll(appProperties['abiFilters'].split(',') as List)
        }
    }
    signingConfigs {
        release {
            if (!signingProperties.isEmpty()) {
                storeFile = new File(signingPropertiesFile.parentFile, signingProperties['storeFile'])
                storePassword = signingProperties['storePassword']
                keyAlias = signingProperties['keyAlias']
                keyPassword = signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: '../gradle/rewarded-networks.gradle'
apply from: '../gradle/verify-release-optimization.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found")
}
