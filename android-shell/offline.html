<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Tic Tac Toe Plus</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #fff; color: #111; font: 18px system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; color: #666; line-height: 1.45; }
      button { min-height: 48px; padding: 0 24px; border: 2px solid currentColor; border-radius: 12px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #f3f3f3; } p { color: #aaa; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения</h1>
      <p>Для запуска игры нужен интернет. Проверьте соединение и попробуйте снова.</p>
      <button type="button" onclick="location.href='https://tic-tac-toe-plus-alpha.stofs.chatgpt.site'">Повторить</button>
    </main>
  </body>
</html>
